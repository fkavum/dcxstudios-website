<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Game</title>
</head>
<body>
  <p>Opening store…</p>

  <script>
    const ua = navigator.userAgent || "";
    const android = /android/i.test(ua);
    const ios = /iphone|ipad|ipod/i.test(ua);

    setTimeout(() => {
      if (android) {
        location.href = "https://play.google.com/store/apps/details?id=com.dcxstudios.dcm";
      } else if (ios) {
        location.href = "https://apps.apple.com/tr/app/crossle/id6751605835";
      } else {
        location.href = "https://dcxstudios.org/#featured-game";
      }
    }, 600);
  </script>
</body>
</html>
