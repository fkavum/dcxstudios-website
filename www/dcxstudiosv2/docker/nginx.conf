server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Preserve port in redirects (fixes localhost:5322 → localhost stripping)
    port_in_redirect on;
    absolute_redirect off;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;
}
