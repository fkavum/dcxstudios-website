# Crossle WebGL — nginx site conf (single source of truth; baked into the image and copied to
# dcxstudios-website/www/docker-files/play-crossle/config/default.conf in DEPLOY_MODE=repo).
server {
    listen       80;
    listen  [::]:80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # NEVER add X-Frame-Options / frame-ancestors here: game.html must be iframe-able by portals.

    # HTML is regenerated every build and references hash-named Build/ files → never cache it
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Build/ files are hash-named (nameFilesAsHashes) → cache forever.
    # Decompression-fallback names (*.unityweb) are gzip on disk; tell the browser so it inflates
    # natively instead of the loader's slow JS path.
    location ~ \.data\.unityweb$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
    }
    location ~ \.framework\.js\.unityweb$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
    }
    location ~ \.wasm\.unityweb$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
    }
    location ~ \.symbols\.json\.unityweb$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/json;
    }

    # Classic gzip names (a build with decompression fallback OFF)
    location ~ \.(data|symbols\.json)\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
    }
    location ~ \.js\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
    }
    location ~ \.wasm\.gz$ {
        gzip off;
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
    }
    location ~ \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else under Build/ (loader.js etc.) — hash-named too
    location /Build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # On-the-fly compression for the remaining text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
