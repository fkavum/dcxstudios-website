server {
    listen       80;
    listen  [::]:80;
    server_name  _; # Catch-all: accepts any domain pointed here

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # This helps if you're using a modern frontend framework (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Enable basic compression for faster game asset loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}