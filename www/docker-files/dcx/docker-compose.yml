version: '3.8'

services:
  web-sunucum:
    build:
      context: "../.."
      dockerfile: "./docker-files/dcx/Dockerfile"
    container_name: static_dcx_site_container
    restart: always
    networks:
      - dokploy-network
    volumes:
      - ./config/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
networks:
  dokploy-network:
    external: true